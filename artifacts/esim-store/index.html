<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>%BRAND_SITE_TITLE%</title>
    <meta name="theme-color" content="%BRAND_COLOR%" />
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <!-- Link previews (Facebook, Messenger, Telegram…). Crawlers don't run JS,
         so these live here, and og:image must be absolute: VITE_SITE_URL is
         the public origin, set on the Railway esim-store service. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:title" content="%BRAND_SHARE_TITLE%" />
    <meta property="og:description" content="%BRAND_DESCRIPTION%" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="mn_MN" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
