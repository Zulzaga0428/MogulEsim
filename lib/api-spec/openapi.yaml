openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AVAESIM Unlimited eSIM Store API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: packages
    description: eSIM package operations
  - name: countries
    description: Country operations
  - name: orders
    description: Order operations
  - name: auth
    description: Authentication operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /countries:
    get:
      operationId: listCountries
      tags: [countries]
      summary: List all countries with unlimited eSIM packages
      responses:
        "200":
          description: List of countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  countries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Country"
                required:
                  - countries

  /countries/{slug}/packages:
    get:
      operationId: listCountryPackages
      tags: [packages]
      summary: List unlimited eSIM packages for a country
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of packages for country
          content:
            application/json:
              schema:
                type: object
                properties:
                  packages:
                    type: array
                    items:
                      $ref: "#/components/schemas/EsimPackage"
                  country:
                    $ref: "#/components/schemas/Country"
                required:
                  - packages
                  - country

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new eSIM order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user info
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Country:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        nameMn:
          type: string
        flag:
          type: string
        region:
          type: string
        packageCount:
          type: integer
      required:
        - id
        - slug
        - name
        - nameMn
        - flag
        - region
        - packageCount

    EsimPackage:
      type: object
      properties:
        id:
          type: string
        packageId:
          type: string
        name:
          type: string
        data:
          type: string
        dataAmount:
          type: number
        validity:
          type: integer
        price:
          type: number
        currency:
          type: string
        priceInMnt:
          type: number
        speed:
          type: string
        isUnlimited:
          type: boolean
        networkType:
          type: string
      required:
        - id
        - packageId
        - name
        - data
        - validity
        - price
        - currency
        - priceInMnt
        - isUnlimited

    CreateOrderRequest:
      type: object
      properties:
        packageId:
          type: string
        customerEmail:
          type: string
        customerName:
          type: string
        quantity:
          type: integer
      required:
        - packageId
        - customerEmail
        - customerName

    Order:
      type: object
      properties:
        id:
          type: string
        packageId:
          type: string
        customerEmail:
          type: string
        customerName:
          type: string
        status:
          type: string
          enum: [pending, paid, completed, failed]
        totalPrice:
          type: number
        currency:
          type: string
        qpayInvoiceId:
          type: string
        qpayQrImage:
          type: string
        qpayDeepLinks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              logo:
                type: string
              link:
                type: string
        esimIccid:
          type: string
        esimQrCode:
          type: string
        createdAt:
          type: string
      required:
        - id
        - packageId
        - customerEmail
        - customerName
        - status
        - totalPrice
        - currency
        - createdAt

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
      required:
        - email
        - password
        - name

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        createdAt:
          type: string
      required:
        - id
        - email
        - name
        - createdAt

    ApiError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
